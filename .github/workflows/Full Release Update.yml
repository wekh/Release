name: Full Release Update

on:
  schedule:
    - cron: '0 0 */2 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release_update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install requests
        run: python -m pip install --upgrade pip requests

      ##############
      # FONGMI APK下载与Release
      ##############
      - name: Download FongMi APKs and extract version
        id: download_fongmi
        run: |
          python - <<'EOF'
          import requests, os, re

          OWNER, REPO = "FongMi", "Release"
          # 精确匹配：asset 名称完全等于下面的名称，保存名也一致
          file_names = [
              "leanback-arm64_v8a.apk",
              "leanback-armeabi_v7a.apk",
              "mobile-arm64_v8a.apk",
              "mobile-armeabi_v7a.apk"
          ]

          DOWNLOAD_DIR = "fongmi_apk_update/apk"
          os.makedirs(DOWNLOAD_DIR, exist_ok=True)

          version_str = "最新"

          res = requests.get(f"https://api.github.com/repos/{OWNER}/{REPO}/releases/latest")
          res.raise_for_status()
          release_data = res.json()

          # 从 tag_name 或 name 提取版本号
          tag_name = release_data.get("tag_name", "")
          release_name = release_data.get("name", "")
          m = re.search(r'v?(\d+(?:\.\d+)+)', tag_name or release_name)
          if m:
              version_str = m.group(1)

          print(f"最新版本: {version_str}")

          downloaded = 0
          for asset in release_data.get("assets", []):
              asset_name = asset["name"]
              if asset_name in file_names:
                  print(f"匹配成功: {asset_name}")
                  r = requests.get(asset["browser_download_url"])
                  r.raise_for_status()
                  with open(os.path.join(DOWNLOAD_DIR, asset_name), "wb") as out:
                      out.write(r.content)
                  downloaded += 1

          print(f"共下载 {downloaded} 个文件")
          if downloaded == 0:
              print("⚠️ 未匹配到任何文件，实际 asset 如下：")
              for asset in release_data.get("assets", []):
                  print(f"  {asset['name']}")

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as gh_out:
              gh_out.write(f"version={version_str}\n")
          EOF

      - name: Create/Update FongMi Release
        run: |
          TAG="FongMi"
          UPDATED_AT=$(date +"%Y-%m-%d %H:%M CST")

          set +e
          RELEASE_ID=$(gh api "/repos/${{ github.repository }}/releases/tags/$TAG" 2>/dev/null | jq -r '.id // empty' 2>/dev/null)
          set -e

          if [ -z "$RELEASE_ID" ] || ! [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "创建新 Release: $TAG"
            gh release create "$TAG" -t "FongMi" -n "更新时间：${UPDATED_AT}" --draft=false
          else
            echo "更新已有 Release: $TAG (ID=$RELEASE_ID)"
            gh api -X PATCH -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/releases/$RELEASE_ID" \
              -f tag_name="$TAG" -f name="FongMi" -f body="更新时间：${UPDATED_AT}"
          fi

          for f in fongmi_apk_update/apk/*; do
            gh release upload "$TAG" "$f" --clobber
          done

          git tag -f $TAG
          git push origin $TAG -f
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      ##############
      # Latest 软件下载与Release（固定 tag，就地更新，--clobber 覆盖）
      ##############
      - name: Create/Update latest Release
        run: |
          TAG="latest"
          NAME="Latest Release"
          UPDATED_AT=$(date +"%Y-%m-%d %H:%M CST")

          set +e
          RELEASE_ID=$(gh api "/repos/${{ github.repository }}/releases/tags/$TAG" 2>/dev/null | jq -r '.id // empty' 2>/dev/null)
          set -e

          if [ -z "$RELEASE_ID" ] || ! [[ "$RELEASE_ID" =~ ^[0-9]+$ ]]; then
            echo "创建新 Release: $TAG"
            gh release create "$TAG" -t "$NAME" -n "更新时间：${UPDATED_AT}" --draft=false
          else
            echo "更新已有 Release: $TAG (ID=$RELEASE_ID)"
            gh api -X PATCH -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/releases/$RELEASE_ID" \
              -f tag_name="$TAG" -f name="$NAME" -f body="更新时间：${UPDATED_AT}"
          fi

          git tag -f "$TAG"
          git push origin "$TAG" -f
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download & Upload Latest Files
        run: |
          function download_upload() {
            REPO=$1
            MATCH=$2
            SAVE_NAME=$3
            EXCLUDE=$4

            url="https://api.github.com/repos/$REPO/releases/latest"

            if [ -z "$EXCLUDE" ]; then
              download_url=$(curl -s "$url" | jq -r ".assets[] | select(.name | contains(\"$MATCH\")) | .browser_download_url" | head -n 1)
            else
              download_url=$(curl -s "$url" | jq -r ".assets[] | select(.name | contains(\"$MATCH\")) | select(.name | contains(\"$EXCLUDE\") | not) | .browser_download_url" | head -n 1)
            fi

            if [ -z "$download_url" ] || [ "$download_url" = "null" ]; then
              echo "⚠️ 未找到文件: $MATCH"
              return
            fi

            echo "⬇️ 下载: $MATCH"
            curl -f -L -o "$SAVE_NAME" "$download_url" || { echo "⚠️ 下载失败: $SAVE_NAME"; return; }

            echo "⬆️ 上传: $SAVE_NAME"
            gh release upload "latest" "$SAVE_NAME" --clobber || { echo "⚠️ 上传失败: $SAVE_NAME"; return; }
          }

          # v2rayNG - 排除 fdroid 版本
          download_upload "2dust/v2rayNG" "_arm64-v8a.apk" "v2rayNG.apk" "fdroid"

          # 其他软件
          download_upload "2dust/v2rayN" "v2rayN-windows-64.zip" "v2rayN-windows-64.zip" ""
          download_upload "MatsuriDayo/NekoBoxForAndroid" "arm64-v8a" "NekoBox.apk" ""
          download_upload "zetaloop/desktop" "GitHubDesktop-Windows-x64.exe" "GitHubDesktop-Windows-x64.exe" ""

          # md3Music
          download_upload "zzyoxml/md3Music" "standard-arm64-v8a.apk" "md3Music-standard-arm64-v8a.apk" ""

          # PiliPlus
          download_upload "bggRGjQaUbCoE/PiliPlus" "arm64-v8a.apk" "PiliPlus-arm64-v8a.apk" ""

          # EchoMusic
          download_upload "hoowhoami/EchoMusic" "Windows-Setup-x64.exe" "EchoMusic-Windows-Setup-x64.exe" ""

          ##############
          # OVSSwitch_x86.fpk (来自 yaya918/FnDepot)
          ##############
          FPK_URL="https://raw.githubusercontent.com/yaya918/FnDepot/main/fpk-ovs-switch-fn/OVSSwitch_x86.fpk"
          if curl -f -L -o "OVSSwitch_x86.fpk" "$FPK_URL"; then
            echo "⬆️ 上传: OVSSwitch_x86.fpk"
            gh release upload "latest" "OVSSwitch_x86.fpk" --clobber || echo "⚠️ 上传失败，跳过 OVSSwitch_x86.fpk"
          else
            echo "⚠️ 上游文件不存在或下载失败，跳过 OVSSwitch_x86.fpk"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update README.md
        run: |
          NEW_TIME=$(date +"%Y-%m-%d %H:%M CST")
          FONGMI_VERSION="${{ steps.download_fongmi.outputs.version }}"

          echo "这是一个用于存放常用软件安装包的仓库，方便快速下载。" > README.md
          echo "" >> README.md
          echo "OK影视（停止更新，最新版本5.1.6）" >> README.md
          echo "" >> README.md
          echo "FongMi（电视版/手机版）" >> README.md
          echo "更新版本 ${FONGMI_VERSION}" >> README.md
          echo "更新时间：${NEW_TIME}" >> README.md
          echo "" >> README.md
          echo "OVSSwitch_x86.fpk（来源：yaya918/FnDepot）" >> README.md
          echo "更新时间：${NEW_TIME}" >> README.md
          echo "" >> README.md
          echo "latest Release" >> README.md
          echo "更新时间：${NEW_TIME}" >> README.md

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "${NEW_TIME}" || echo "No changes to commit."
          git push
